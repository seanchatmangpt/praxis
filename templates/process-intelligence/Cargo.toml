[workspace]
resolver = "2"
members = ["crates/sample-service"]

[workspace.package]
version = "26.6.30"
edition = "2021"

[workspace.dependencies]
chicago-tdd-tools = { version = "=26.6.30", features = ["snapshot-testing", "property-testing", "ocel-generation"] }
wasm4pm-compat = { version = "26.6.28", features = ["formats"] }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proptest = "1.4"
insta = { version = "1", features = ["json"] }
tempfile = "3"
uuid = { version = "1.6", features = ["v4"] }

[patch.crates-io]
chicago-tdd-tools = { path = "../../../chicago-tdd-tools" }
wasm4pm-compat = { path = "../../../wasm4pm-compat" }
