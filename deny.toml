# cargo-deny configuration (schema v2; targets cargo-deny >= 0.16).
# Run locally with `cargo deny check` or `just deny`; enforced in CI.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
# RustSec advisory DB — local cache and upstream URL.
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Vulnerabilities are always denied in this cargo-deny schema; `vulnerability`
# and `notice` config keys were removed upstream (see EmbarkStudios/cargo-deny#611).
unmaintained = "workspace"
yanked = "warn"
ignore = []

[licenses]
version = 2
# House policy: permissive licenses only. Copyleft (GPL/AGPL/LGPL) is denied
# by omission so a transitive copyleft dep fails CI loudly.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    # prolog8 / wasm4pm-cognition (bcinr-pddl's admission-gate engine and
    # wasm4pm's cognition crate, both load-bearing transitive deps) —
    # source-available, converts to Apache-2.0 after their change date.
    # Same house decision already made and documented in bcinr's own
    # deny.toml; propagated here rather than re-litigated.
    "BUSL-1.1",
]
confidence-threshold = 0.9
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path deps within the house ecosystem are allowed to use wildcard versions.
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/seanchatmangpt"]
