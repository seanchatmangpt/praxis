name: Miri (UB detection)

# Miri is the only way to detect undefined behavior in transitive deps.
# #![forbid(unsafe_code)] does NOT cover transitive deps.
# Run weekly and on demand; not required on every PR (slow: ~10–20 min).

on:
  schedule:
    - cron: "0 3 * * 1"  # Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MIRIFLAGS: "-Zmiri-strict-provenance"

jobs:
  miri:
    name: miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b  # stable
        with:
          toolchain: nightly
          components: miri, rust-src
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1  # v2.8.1
        with:
          key: miri
      - name: Run Miri
        run: cargo miri test --workspace
        timeout-minutes: 30
