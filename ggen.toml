  }
  GROUP BY ?noun ?verb ?handler ?comment
  ORDER BY ?verb
""" }
template    = { file = "templates/crates/ggen/verbs_noun.rs.tera" }
output_file = "crates/ggen/src/verbs/graph.rs"
mode        = "Overwrite"

