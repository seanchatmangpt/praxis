[project]
name = "ggen"

[ontology]
source = "schema/praxis.ttl"

[ontology.prefixes]
praxis = "http://seanchatmangpt.github.io/praxis/schema#"
rdf    = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs   = "http://www.w3.org/2000/01/rdf-schema#"
xsd    = "http://www.w3.org/2001/XMLSchema#"
compat = "https://wasm4pm.dev/ns#"
pi     = "https://wasm4pm.dev/pi#"
law    = "http://seanchatmangpt.github.io/praxis/law#"

[packs]
wasm4pm-facts-pack = { path = "packs/wasm4pm-facts-pack" }
standing-pack = { path = "../cargo-cicd/plugins/cargo-cicd-kit/standing-pack" }
chatman-engine-pack = { path = "packs/chatman-engine-pack" }
otel-weaver-pack = { path = "packs/otel-weaver-pack" }
ocel-bench-pack = { path = "packs/ocel-bench-pack" }
arazzo-pack = { path = "packs/arazzo-pack" }
jira-tracking-pack = { path = "packs/jira-tracking-pack" }
shape-admission-pack = { path = "packs/shape-admission-pack" }
semantic-contraction-pack = { path = "packs/semantic-contraction-pack" }
pddl-planning-pack = { path = "packs/pddl-planning-pack" }
f26-ontology-self-play-pack = { path = "packs/f26-ontology-self-play-pack" }

[law]
rules = ["ontology/rules/breed_standing.n3"]

[templates]
dir = "templates/crates/ggen"
