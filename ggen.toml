""" }
template    = { file = "templates/src/lsp.rs.tera" }
output_file = "src/lsp.rs"
mode        = "Overwrite"

# Generate cli.rs (Noun-Verb command routes)
[[generation.rules]]
name        = "src-cli"
query       = { inline = """
  PREFIX praxis: <http://seanchatmangpt.github.io/praxis/schema#>
  SELECT ?name
  WHERE {
    ?p a praxis:Project ;
       praxis:name ?name .
  }
""" }
template    = { file = "templates/src/cli.rs.tera" }
output_file = "src/cli.rs"
mode        = "Overwrite"

# ---------------------------------------------------------------------------
# crates/ggen — noun-verb routes generated from praxis:CliCommand instances
# (praxis:inCrate praxis:CrateGgen). Route files are pure projections of the
# ontology (Overwrite); hand logic lives in crates/ggen/src/verbs/handlers.rs.
# ---------------------------------------------------------------------------

[[generation.rules]]
name        = "crate-ggen-verbs-mod"
query       = { inline = """
  PREFIX praxis: <http://seanchatmangpt.github.io/praxis/schema#>
  SELECT DISTINCT ?noun
  WHERE {
    ?cmd a praxis:CliCommand ;
         praxis:inCrate ?c ;
         praxis:noun ?noun .
    ?c praxis:name "ggen" .
  }
  ORDER BY ?noun
""" }
template    = { file = "templates/crates/ggen/verbs_mod.rs.tera" }
output_file = "crates/ggen/src/verbs/mod.rs"
mode        = "Overwrite"

[[generation.rules]]
name        = "crate-ggen-verbs-sync"
query       = { inline = """
  PREFIX praxis: <http://seanchatmangpt.github.io/praxis/schema#>
  PREFIX rdfs:   <http://www.w3.org/2000/01/rdf-schema#>
  SELECT ?noun ?verb ?handler ?comment (GROUP_CONCAT(?flag; separator=",") AS ?flags)
  WHERE {
    {
      SELECT ?cmd ?noun ?verb ?handler ?comment ?flag
      WHERE {
        ?cmd a praxis:CliCommand ;
             praxis:inCrate ?c ;
             praxis:noun ?noun ;
             praxis:verb ?verb ;
             praxis:handler ?handler .
        ?c praxis:name "ggen" .
        OPTIONAL { ?cmd rdfs:comment ?comment }
        OPTIONAL { ?cmd praxis:flag ?flag }
        FILTER(?noun = "sync")
      }
      ORDER BY ?flag
    }
  }
  GROUP BY ?noun ?verb ?handler ?comment
  ORDER BY ?verb
""" }
template    = { file = "templates/crates/ggen/verbs_noun.rs.tera" }
output_file = "crates/ggen/src/verbs/sync.rs"
mode        = "Overwrite"

[[generation.rules]]
name        = "crate-ggen-verbs-graph"
query       = { inline = """
  PREFIX praxis: <http://seanchatmangpt.github.io/praxis/schema#>
  PREFIX rdfs:   <http://www.w3.org/2000/01/rdf-schema#>
  SELECT ?noun ?verb ?handler ?comment (GROUP_CONCAT(?flag; separator=",") AS ?flags)
  WHERE {
    {
      SELECT ?cmd ?noun ?verb ?handler ?comment ?flag
      WHERE {
        ?cmd a praxis:CliCommand ;
             praxis:inCrate ?c ;
             praxis:noun ?noun ;
             praxis:verb ?verb ;
             praxis:handler ?handler .
        ?c praxis:name "ggen" .
        OPTIONAL { ?cmd rdfs:comment ?comment }
