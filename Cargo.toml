[package]
name = "my-conforming-project"
version = "26.6.30"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
description = "A standardized, structurally conforming boilerplate project."
repository = "https://github.com/seanchatmangpt/my-conforming-project"
homepage = "https://github.com/seanchatmangpt/my-conforming-project"
documentation = "https://docs.rs/my-conforming-project"
readme = "README.md"
keywords = ["praxis", "generated"]
categories = ["development-tools"]

[lib]
doctest = false


[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unexpected_cfgs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
unwrap_used = "warn"
expect_used = "warn"

[features]
default = ["typestate"]
typestate = []
repl  = ["dep:rustyline"]
otel  = []
discovery = []
lsp   = ["dep:lsp-max", "lsp-max/proposed", "dep:tree-sitter", "dep:tree-sitter-rust", "dep:dashmap", "dep:parking_lot", "dep:tokio"]
mcp   = ["dep:rmcp", "dep:rmcp-macros", "dep:tokio"]
ggen  = ["dep:oxigraph", "dep:tera", "dep:uuid"]
law-signed = ["praxis-core/signed"]
law-ocel = ["praxis-core/ocel"]
testbed = ["dep:rust-fable-testbed"]
all-features = ["typestate", "repl", "otel", "discovery", "lsp", "mcp", "ggen", "law-signed", "law-ocel", "testbed"]

[dependencies]
once_cell = "1"
rustyline = { version = "14", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
blake3 = "1"
linkme = "0.3"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"], optional = true }
lsp-max = { version = "26.6.24", optional = true }
tree-sitter = { version = "0.26", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
dashmap = { version = "6", optional = true }
parking_lot = { version = "0.12", optional = true }
oxigraph = { version = "0.5.8", optional = true }
tera = { version = "1.20.0", optional = true }
uuid = { version = "1.10.0", features = ["v4"], optional = true }
clap-noun-verb = { version = "26.6.2" }
clap-noun-verb-macros = { version = "26.6.2" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
schemars = { version = "1.0", features = ["derive"] }
rmcp = { version = "0.11.0", features = ["transport-io"], optional = true }
rmcp-macros = { version = "0.11.0", optional = true }
praxis-core = { path = "crates/praxis-core" }
rust-fable-testbed = { path = "crates/rust-fable-testbed", optional = true }
hex = "0.4"
bcinr-powl-receipt = { path = "../bcinr/crates/bcinr-powl-receipt", version = "26.6.24" }
bcinr-pddl = { path = "../bcinr/crates/bcinr-pddl", version = "26.6.26" }
bcinr-powl = { path = "../bcinr/crates/bcinr-powl", version = "26.6.25" }
prolog8 = { path = "../wasm4pm/crates/prolog8", version = "26.7.1" }
wasm4pm-compat = { path = "../wasm4pm-compat", version = "26.6.29" }
wasm4pm-cognition = { path = "../wasm4pm/crates/wasm4pm-cognition", version = "26.7.1" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
insta = { version = "1", features = ["json"] }
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
praxis-retrofit = { path = "crates/praxis-retrofit" }
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "dod"
path = "src/bin/dod.rs"

[[bin]]
name = "mcp_server"
path = "src/bin/mcp_server.rs"
required-features = ["mcp"]

[[bin]]
name = "mcp_lawobject_server"
path = "src/bin/mcp_lawobject_server.rs"
required-features = ["mcp"]

[[bench]]
name = "bench_main"
harness = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
lsp-max = { path = "/Users/sac/lsp-max" }
wasm4pm-compat = { path = "../wasm4pm-compat" }

[workspace]
resolver = "2"
members = [
    "crates/chatman-common",
    "crates/praxis-core",
    "crates/praxis-retrofit",
    "crates/rust-fable-testbed",
]
[workspace.metadata.dylint]
libraries = [{ git = "https://github.com/seanchatmangpt/chicago-tdd-tools", pattern = "crates/chicago-lints" }]
