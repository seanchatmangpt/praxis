[package]
name = "my-conforming-project"
version = "26.7.2"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
description = "A standardized, structurally conforming boilerplate project."
repository = "https://github.com/seanchatmangpt/my-conforming-project"
homepage = "https://github.com/seanchatmangpt/my-conforming-project"
documentation = "https://docs.rs/my-conforming-project"
readme = "README.md"
keywords = ["praxis", "generated"]
categories = ["development-tools"]

[lib]
doctest = false


[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unexpected_cfgs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# unwrap_used/expect_used were "warn": unachievable under CI's `-D warnings`
# promotion because the house test style deliberately uses `.expect("reason")`.
# Recorded lint debt, v26.7.6 gate (RELEASE_CONTROL.md Sec. 9).
unwrap_used = "allow"
expect_used = "allow"

[features]
default = ["typestate"]
typestate = []
repl  = ["dep:rustyline"]
otel  = []
discovery = []
lsp   = ["dep:lsp-max", "lsp-max/proposed", "dep:tree-sitter", "dep:tree-sitter-rust", "dep:dashmap", "dep:parking_lot", "dep:tokio"]
# Lighter than `lsp`: just the lsp-max dependency, for its `andon` module
# (InvariantRegistry / AdmissionGate / patterns). Does not pull in
# tree-sitter/tokio/dashmap/parking_lot — lsp-max's andon module is not
# feature-gated internally, so the bare dependency is all this needs.
andon = ["dep:lsp-max"]
# The MCP membrane exists to drive the full Day 2 revenue pipe (propose ->
# plan -> judge/admit/receipt), so it always pulls `proposer`: the propose_*
# tools are unconditional members of the tool router (the rmcp `#[tool_router]`
# macro emits router entries for every listed tool, so they cannot be cfg-gated
# per-method). `agent8` backs the session AgentByte + fleet_status.
mcp   = ["dep:rmcp", "dep:rmcp-macros", "dep:tokio", "dep:moka", "dep:agent8", "proposer"]
ggen  = ["dep:oxigraph", "dep:tera", "dep:uuid", "dep:ggen-graph"]
law-signed = ["praxis-core/signed"]
law-ocel = ["praxis-core/ocel"]
testbed = ["dep:rust-fable-testbed"]
# PR-14 proposer layer (AR-9: proposals are observations, not authority)
# Also pulls `toml` for the RevTAC v0 mission format (JSON or TOML missions).
proposer = ["dep:praxis-proposer", "dep:toml"]
all-features = ["typestate", "repl", "otel", "discovery", "lsp", "andon", "mcp", "ggen", "law-signed", "law-ocel", "testbed", "proposer"]

[dependencies]
once_cell = "1"
oxrdf = { version = "=0.3.3", features = ["rdfc-10"] }
rustyline = { version = "14", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
blake3 = "1"
linkme = "0.3"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"], optional = true }
lsp-max = { version = "26.6.24", optional = true }
tree-sitter = { version = "0.26", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
dashmap = { version = "6", optional = true }
parking_lot = { version = "0.12", optional = true }
oxigraph = { version = "0.5.9", optional = true }
tera = { version = "1.20.0", optional = true }
uuid = { version = "1.10.0", features = ["v4"], optional = true }
ggen-graph = { path = "../ggen/crates/ggen-graph", optional = true }
clap-noun-verb = { version = "26.6.2" }
clap-noun-verb-macros = { version = "26.6.2" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
schemars = { version = "1.0", features = ["derive"] }
rmcp = { version = "0.11.0", features = ["transport-io"], optional = true }
rmcp-macros = { version = "0.11.0", optional = true }
moka = { version = "0.12", features = ["future"], optional = true }
praxis-core = { path = "crates/praxis-core" }
agent8 = { path = "crates/agent8", optional = true }
praxis-proposer = { path = "crates/praxis-proposer", optional = true }
praxis-retrofit = { path = "crates/praxis-retrofit" }
rust-fable-testbed = { path = "crates/rust-fable-testbed", optional = true }
star-toml = "26.7.3"
toml = { version = "0.8", optional = true }
hex = "0.4"
bcinr-powl-receipt = { path = "../bcinr/crates/bcinr-powl-receipt", version = "26.6.24" }
bcinr-pddl = { path = "../bcinr/crates/bcinr-pddl", version = "26.6.26" }

praxis-synthesis = { path = "crates/praxis-synthesis", version = "26.7.2" }
bcinr-powl = { path = "../bcinr/crates/bcinr-powl", version = "26.6.25" }
prolog8 = { path = "../wasm4pm/crates/prolog8", version = "26.7.1" }
wasm4pm-compat = { path = "/Users/sac/wasm4pm-compat", version = "26.6.29" }
# OCEL evidence-log process validation (src/bin/ocel_process_validate.rs):
# POWL release-loop model + membership, sha256 for the report's log digest,
# chrono only to parse/emit the OCEL evidence timestamps (evidence time,
# never a hash input — the no-wall-clock invariant covers receipt paths).
powl2-decompose = { path = "crates/powl2-decompose", version = "26.6.30" }
chrono = "0.4"
sha2 = "0.10"
wasm4pm-cognition = { path = "../wasm4pm/crates/wasm4pm-cognition", version = "26.7.1" }
# GraphLaw judgment (src/bin/case_study_judge.rs, docs/case-studies/
# autonomic-standing-factory/ Lane 2): the root crate is NOT dep-frozen
# (only praxis-synthesis is, per tests/no_llm_runtime.rs), so this is a
# plain path dependency on the in-workspace SHACL/ShEx/N3/Datalog engine.
praxis-graphlaw = { path = "crates/praxis-graphlaw", version = "26.7.9" }
# WASM builds: getrandom must compile with wasm_js feature (pulled transitively via praxis-graphlaw deps)
getrandom = { version = "0.3", features = ["wasm_js"] }
spargebra = "0.3.5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
insta = { version = "1", features = ["json", "redactions"] }
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
divan = "0.1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
# Differential-verification oracle pair (tests/differential.rs, Pair 1 PLANNERS):
# independent PDDL temporal planner (wasm4pm-native, greedy-tick scheduler)
# checked against praxis's bcinr-pddl dep on a shared durative-STRIPS corpus.
wasm4pm-planner = { path = "../wasm4pm/crates/wasm4pm-planner", version = "26.7.1" }

[[bin]]
name = "dod"
path = "src/bin/dod.rs"

[[bin]]
name = "ocel_process_validate"
path = "src/bin/ocel_process_validate.rs"

[[bin]]
name = "case_study_judge"
path = "src/bin/case_study_judge.rs"

[[bin]]
name = "revenue_demo"
path = "src/bin/revenue_demo.rs"
required-features = ["proposer"]

[[bin]]
name = "mcp_server"
path = "src/bin/mcp_server.rs"
required-features = ["mcp"]

[[bin]]
name = "mcp_lawobject_server"
path = "src/bin/mcp_lawobject_server.rs"
required-features = ["mcp"]

[[bench]]
name = "bench_main"
harness = false

[[bench]]
name = "receipt_validate"
harness = false

[[bench]]
name = "blue_river_dam"
harness = false

# Iteration profile for `cargo build`/`cargo test`/`cargo check` (no LTO — see release below).
# debug = 1 (line tables only, no full variable info) cuts link time and object size across
# the ~30+ separate integration-test binaries under crates/praxis-graphlaw/tests/*.rs, which
# otherwise each pay full debuginfo cost for the same shared deps (oxigraph, praxis_graphlaw).
# incremental = false: sccache (docs/BUILD_CACHING.md) cannot cache incremental compilation
# artifacts, and this repo's win from sccache is specifically cross-binary object-level reuse
# of shared deps -- incremental defeats that. Trade-off: slower single-file edit/recheck loop
# in exchange for cache hits shared across the ~30+ test binaries.
[profile.dev]
debug = 1
incremental = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# `cargo bench` compiles the lib in bench profile; without this override it
# inherits release's `panic = "abort"` while bench/test harness targets are
# forced to unwind, and the two cannot link (rust-lang/cargo#6313). Pin the
# whole bench profile to unwind so `cargo bench` builds cleanly.
[profile.bench]
panic = "unwind"

[patch.crates-io]
# lsp-max is published (v26.7.3, confirmed on crates.io 2026-07-03) but the
# patch stays: bcinr-pddl-lsp hardcodes lsp-max = { path = "../../../lsp-max" }
# (a raw path, same unification requirement as wasm4pm-compat below) --
# removing this patch would resolve two distinct lsp-max copies wherever
# both this workspace and bcinr-pddl-lsp are in the same dependency graph.
lsp-max = { path = "/Users/sac/lsp-max" }
# Required for unification with bcinr-pddl's own hardcoded path dependency
# on wasm4pm-compat (see /Users/sac/bcinr/crates/bcinr-pddl/Cargo.toml) --
# without this, cargo resolves two distinct copies of wasm4pm-compat (one
# from crates.io, one from bcinr-pddl's path dep) and type-mismatches at
# any crate boundary crossing both (e.g. tests/indexed_grounding.rs).
wasm4pm-compat = { path = "/Users/sac/wasm4pm-compat" }
affidavit = { path = "/Users/sac/affidavit" }
# Required for unification with praxis-graphlaw's hardcoded path dependency on
# bcinr-powl (which depends on bcinr-logic by path): without this, a binary
# linking BOTH praxis-graphlaw (path bcinr-logic) and a registry bcinr-powl
# (registry bcinr-logic) — e.g. cng --features bench — carries two copies of
# bcinr-logic whose #[no_mangle] symbols (aabb_intersect_branchless, ...)
# collide under the release profile's fat LTO.
bcinr-logic = { path = "/Users/sac/bcinr/crates/bcinr-logic" }
# Required for unification: cng and multifractal-workflow declare the registry
# version (`bcinr-pddl = "26.6.26"`, preserving their registry-only
# publishability surface) while the workspace root and praxis-graphlaw
# path-depend on the local checkout. Without this patch those are two distinct
# Cargo SourceIds — edits to /Users/sac/bcinr/crates/bcinr-pddl never reach
# cng/multifractal-workflow builds, and types mismatch at crate boundaries
# crossing both.
bcinr-pddl = { path = "/Users/sac/bcinr/crates/bcinr-pddl" }

[workspace]
resolver = "2"
members = [
    "crates/agent8",
    "crates/cng",
    "crates/ggen",
    "crates/chatman-common",
    "crates/praxis-core",
    "crates/praxis-proposer",
    "crates/praxis-retrofit",
    "crates/rust-fable-testbed",
    "crates/powl2-decompose",
    "crates/praxis-synthesis",
    "crates/praxis-lean",
    "crates/praxis-graphlaw",
    "crates/praxis-graphlaw-wasm",
    "crates/wasm4pm-arazzo",
    "crates/multifractal-workflow",
    "audit-tools", "apps/air_core/native/air_core_nif", "crates/mfact-core",
]
[workspace.metadata.dylint]
libraries = [{ path = "/Users/sac/chicago-tdd-tools/crates/chicago-lints" }]
