name: Anti-Regression Gate

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'Cargo.workspace.toml'
      - '.github/**'
      - 'src/**'
      - 'justfile'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  praxis-compliance:
    name: Praxis Compliance Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CalVer versioning
        run: |
          if [ -f Cargo.toml ]; then
            if ! grep -q '^\[workspace\]' Cargo.toml; then
              VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
              if ! [[ $VERSION =~ ^[0-9]{2}\.[0-9]+\.[0-9]+$ ]]; then
                echo "CalVer version check FAILED: '$VERSION' does not match YY.M.patch"
                exit 1
              fi
            fi
          fi
        shell: bash

      - name: Check license compliance
        run: |
          if [ -f Cargo.toml ]; then
            if ! grep -q '^\[workspace\]' Cargo.toml; then
              if ! grep -q '^license = "MIT OR Apache-2.0"' Cargo.toml; then
                echo "License check FAILED: must be 'MIT OR Apache-2.0'"
                exit 1
              fi
            fi
          fi
        shell: bash

      - name: Check LICENSE files present
        run: |
          MISSING=""
          [ ! -f LICENSE-MIT ] && MISSING="$MISSING LICENSE-MIT"
          [ ! -f LICENSE-APACHE ] && MISSING="$MISSING LICENSE-APACHE"
          if [ -n "$MISSING" ]; then
            echo "LICENSE files check FAILED: Missing$MISSING"
            exit 1
          fi
        shell: bash

      - name: Check for backup files
        run: |
          if find . -name '*.rs.backup' -type f 2>/dev/null | grep -q .; then
            echo "Backup files check FAILED: *.rs.backup files should not be committed"
            exit 1
          fi
        shell: bash

  unsafe-code-gate:
    name: Unsafe Code Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check unsafe_code forbid
        run: |
          if grep -q '^\[lints\.rust\]' Cargo.toml; then
            if ! grep -A 5 '^\[lints\.rust\]' Cargo.toml | grep -q 'unsafe_code = "forbid"'; then
              if grep -qE 'name\s*=\s*"(linkme|wasm|specgen)' Cargo.toml; then
                echo "Unsafe code exception allowed for linkme/WASM/specgen crate"
              else
                echo "Unsafe code gate FAILED: unsafe_code should be 'forbid' for non-exempt crates"
                exit 1
              fi
            fi
          fi
        shell: bash

      - name: Run clippy with deny-todo gate
        run: |
          cargo clippy --all-targets --all-features -- -D warnings \
            -W clippy::todo \
            -W clippy::unimplemented \
            -W clippy::dbg_macro
        continue-on-error: false

  pattern-gate:
    name: Pattern Detection Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect dbg! macros
        run: |
          FOUND=$(git diff ${{ github.event.pull_request.base.sha }} HEAD -- '*.rs' | grep '^\+.*dbg!(' || true)
          if [ -n "$FOUND" ]; then
            echo "Pattern gate FAILED: dbg!() macro detected in changes"
            echo "$FOUND" | head -5
            exit 1
          fi
        shell: bash
        continue-on-error: false

      - name: Detect panic! in library code
        run: |
          FOUND=$(git diff ${{ github.event.pull_request.base.sha }} HEAD -- 'src/**/*.rs' | grep '^\+.*panic!(' | grep -v 'tests' || true)
          if [ -n "$FOUND" ]; then
            echo "WARNING: panic!() in library code (should use Result/? operator)"
            echo "$FOUND" | head -3
          fi
        shell: bash
        continue-on-error: true

      - name: Detect unwrap() in library code
        run: |
          FOUND=$(git diff ${{ github.event.pull_request.base.sha }} HEAD -- 'src/**/*.rs' | grep '^\+.*\.unwrap()' | grep -v 'tests' | grep -v 'examples' || true)
          if [ -n "$FOUND" ]; then
            echo "WARNING: unwrap() in library code (prefer ? operator)"
          fi
        shell: bash
        continue-on-error: true

  workspace-gate:
    name: Workspace Structure Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify workspace inheritance
        run: |
          if grep -q '^\[workspace\]' Cargo.toml; then
            echo "Workspace detected (skipping single-crate checks)"
          fi
        shell: bash
        continue-on-error: true

  msrv-consistency:
    name: MSRV Consistency Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and verify declared MSRV
        run: |
          if grep -q '^rust-version' Cargo.toml; then
            MSRV=$(grep '^rust-version' Cargo.toml | head -1 | sed 's/rust-version = "\(.*\)"/\1/')
          elif grep -q '^\[workspace\.package\]' Cargo.toml; then
            MSRV=$(grep -A 20 '^\[workspace\.package\]' Cargo.toml | grep '^rust-version' | head -1 | sed 's/rust-version = "\(.*\)"/\1/')
          else
            MSRV="1.82"
          fi

          MAJOR=$(echo $MSRV | cut -d. -f1)
          MINOR=$(echo $MSRV | cut -d. -f2)

          if (( MAJOR < 1 || (MAJOR == 1 && MINOR < 82) )); then
            echo "MSRV gate FAILED: $MSRV is below house minimum (1.82)"
            exit 1
          else
            echo "MSRV check passed: $MSRV meets house minimum"
          fi
        shell: bash

  report-results:
    name: Report Compliance Results
    runs-on: ubuntu-latest
    if: always()
    needs: [praxis-compliance, unsafe-code-gate, pattern-gate, workspace-gate, msrv-consistency]
    steps:
      - uses: actions/checkout@v4

      - name: Determine overall status
        id: status
        run: |
          if [ "${{ needs.praxis-compliance.result }}" = "failure" ] || \
             [ "${{ needs.unsafe-code-gate.result }}" = "failure" ] || \
             [ "${{ needs.pattern-gate.result }}" = "failure" ] || \
             [ "${{ needs.workspace-gate.result }}" = "failure" ] || \
             [ "${{ needs.msrv-consistency.result }}" = "failure" ]; then
            echo "status=FAILED" >> $GITHUB_OUTPUT
          else
            echo "status=PASSED" >> $GITHUB_OUTPUT
          fi

      - name: Post PR comment if gates failed
        if: steps.status.outputs.status == 'FAILED' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = "## Praxis Anti-Regression Gate\n\n" +
              "This PR has violations of praxis house standards. Check job logs for details.\n\n" +
              "**Fixes needed:**\n" +
              "- CalVer format: version = \"26.6.0\" (YY.M.patch)\n" +
              "- License: license = \"MIT OR Apache-2.0\"\n" +
              "- Lints: Add [lints] with workspace = true\n" +
              "- unsafe_code: Set to forbid in [lints.rust]\n" +
              "- Macros: Remove dbg!(), todo!(), unimplemented!()\n" +
              "- Backup files: find . -name \"*.rs.backup\" -delete\n" +
              "- MSRV: Set rust-version = \"1.82\" or higher\n\n" +
              "Full guide: https://github.com/seanchatmangpt/praxis/blob/main/ANTI_REGRESSION_GATES.md";
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail if gates failed
        if: steps.status.outputs.status == 'FAILED'
        run: exit 1
