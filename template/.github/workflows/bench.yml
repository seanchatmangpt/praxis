name: Benchmarks

# Criterion benchmark regression gate.
# Fails if performance regresses more than 150% vs the stored baseline.
# Run on push to main only (not PRs) to avoid benchmark noise from shared runners.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # needed to push benchmark data to gh-pages

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b  # stable
        with:
          toolchain: "1.82.0"
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1  # v2.8.1
        with:
          key: bench
      - name: Run benchmarks
        run: cargo bench --workspace -- --output-format bencher | tee target/bench-output.txt
      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba  # v1.22.1
        with:
          tool: cargo
          output-file-path: target/bench-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          fail-on-alert: true
          alert-threshold: "150%"
          comment-on-alert: true
