# AI integrity gate — suppression manifest.
# Lists patterns, constructs, and files that must not be generated by AI tooling
# without explicit human review. CI checks that AI-modified files do not introduce
# banned patterns.
#
# Philosophy: AI is permitted and encouraged for boilerplate, tests, and docs.
# The following are human-only because they encode trust boundaries, formal
# invariants, or compliance commitments.

[rules]

# The _seal: () field encodes a non-forgeable provenance commitment.
# AI must not add or remove it — the seal is a human decision.
[[rules.patterns]]
name    = "seal-field"
pattern = "_seal: ()"
files   = ["src/types.rs", "src/**/*.rs"]
message = "The Seal pattern encodes a trust boundary. Human review required."

# Receipt chain_hash computation must not be altered by AI — any change
# invalidates all previously issued receipts.
[[rules.patterns]]
name    = "chain-hash-computation"
pattern = "chain_hash"
files   = ["src/chain.rs"]
message = "chain_hash computation is a compliance commitment. Human review required."

# The linkme distributed slice registration list is the authoritative verb registry.
# AI may add verbs but must not remove them (removing breaks published APIs).
[[rules.patterns]]
name    = "distributed-slice-registration"
pattern = "#\\[distributed_slice"
files   = ["src/**/*.rs"]
message = "Distributed slice registrations define the public verb API. Review removals carefully."

[exemptions]
# Files where all AI modifications are permitted.
files = [
    "src/verbs/*.rs",        # verb implementations: AI can scaffold freely
    "tests/**/*.rs",         # test files: AI can generate tests freely
    "examples/**/*.rs",      # examples: AI can generate freely
    "benches/**/*.rs",       # benchmarks: AI can generate freely
    "CHANGELOG.md",          # changelog: AI can draft entries
]
