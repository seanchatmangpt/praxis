[package]
name = "{{project-name}}-mcp"
version = "26.6.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
description = "MCP server for {{project-name}}"
repository = "https://github.com/seanchatmangpt/{{project-name}}"

[[bin]]
name = "{{project-name}}-mcp"
path = "src/main.rs"

[features]
# Enable clap-derived CLI arg structs that mirror the MCP tool arguments.
# Use when the same service is exposed as both MCP (stdio) and a binary CLI.
# Adds TimeWindowCliArgs (clap::Args) to shared_args with From<> conversion.
clap-cli = ["dep:clap"]

[dependencies]
# rmcp is the Rust MCP SDK. Check crates.io for the current version.
rmcp = { version = "0.1", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
blake3 = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Optional: only pulled in when the `clap-cli` feature is enabled.
clap = { version = "4", features = ["derive"], optional = true }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
