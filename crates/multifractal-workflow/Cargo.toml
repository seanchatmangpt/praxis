# Analyzer) is a disclosed, always-refusing, not-yet-implemented stub.
wasm4pm-cognition = { path = "../../../wasm4pm/crates/wasm4pm-cognition", version = "26.7.6" }
wasm4pm-planner = { path = "../../../wasm4pm/crates/wasm4pm-planner", version = "26.7.6" }

# `crown-bribery-case` bin (Stage 2 of a 4-stage build): real dependency on
# the workspace ROOT package (`my-conforming-project`, crate name
# `my_conforming_project`) for its `mfg::manufacture` function -- the same
# real SPARQL-extraction + `enforce_pddl8` bound-checking + PDDL8-text-
# emission pipeline `tests/bribery_case_pddl.rs` (repo root) already proved
# against `fixtures/bribery-case/pddl-domain.ttl`. This is the reverse of
# every other path dependency in this file: the root package depends on
# NEITHER `multifractal-workflow` NOR anything that depends on it (checked
# this session via `grep -n multifractal-workflow /Users/sac/praxis/
# Cargo.toml`, zero hits), so this is a one-way edge, not a cycle. Only the
# `ggen` feature is requested (not the crate's `mcp`/`lsp`/`repl` features,
# which pull heavy, unrelated dependency trees) -- `ggen` is exactly what
# `mfg` needs (`dep:oxigraph`, `dep:tera`, `dep:ggen-graph`), and `oxigraph`/
# `tera` are already resolved elsewhere in this same dependency graph (F04's
# `oxigraph = "0.5"` above, F30's `tera = "1.20.0"` above), so this does not
# force a second resolution of either. See src/bin/crown-bribery-case.rs for
# the full call site.
my-conforming-project = { path = "../..", features = ["ggen"] }

[dev-dependencies]
# f13_arazzo_artifact's tests construct a real Powl::ExternalCut fixture
# (mirrors praxis_core::arazzo's own test fixture) to drive the pipeline
# through this crate's re-exports end-to-end. (powl2-decompose is already a
# normal [dependencies] entry above for F10, so it is in scope for tests too
# without a separate dev-dependency line.)
#
# F15/F16 escript-bridge stdout-contract fuzzing: property-based tests in
# f15_air_transition_core::bridge and f16_otp_runner::bridge feed arbitrary
# (malformed/truncated/wrong-typed) strings into parse_bridge_stdout /
# parse_dispatch_statem_stdout (the process-spawn-free stdout-parsing
# functions those modules now factor out) and assert every generated input
# returns a typed Err, never panics -- the same "no panic on external input"
# invariant this workspace's own no-overclaiming-rust rule requires, applied
# to a boundary that previously only had hand-picked negative test cases.
# Version pinned identically to the root package's own `proptest = "1"` dev-
# dependency (Cargo.toml:129) so this does not force a second resolution;
# Cargo.lock already resolves proptest 1.11.0 for this workspace.
proptest = "1"
