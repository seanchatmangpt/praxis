[package]
name = "praxis-reconciler"
version = "26.8.18"
edition = "2021"
rust-version = "1.82"
repository = "https://github.com/seanchatmangpt/praxis"
license = "MIT OR Apache-2.0"
description = "DfCM + BRCE reconciliation kernel: admit O*, preserve reversible options, construct intents, authorize DO, receipt, and replay"

[lib]
doctest = false

[dependencies]
chatman-common = { path = "../chatman-common", version = "26.7.2", features = ["provenance"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"
