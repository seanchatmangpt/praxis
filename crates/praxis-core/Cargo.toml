[package]
name = "praxis-core"
version = "26.6.30"
edition = "2021"

[features]
default = []
signed = ["chatman-common/signed-receipts"]
ocel = []

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chatman-common = { path = "../chatman-common", optional = true }
bcinr-powl-receipt = { path = "../../../bcinr/crates/bcinr-powl-receipt" }
wasm4pm-compat = { path = "../../../wasm4pm-compat" }
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
