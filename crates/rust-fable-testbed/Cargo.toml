[package]
name = "rust-fable-testbed"
version = "26.7.2"
edition = "2021"
rust-version = "1.82"
repository = "https://github.com/seanchatmangpt/praxis"
license = "MIT OR Apache-2.0"
description = "Deterministic Rust-eval testbed for Claude models: RDF/Turtle task specs -> compiled prompts -> sandboxed cargo verification -> BLAKE3-chained receipts."

[dependencies]
# `prompt_mfg` (src/prompt_mfg/) is a vendored copy of ggen-core's prompt_mfg
# module, pinned to ggen commit 68d3c2560 (last commit before ggen-core was
# retired upstream in favor of ggen-engine, which did not migrate prompt_mfg;
# see ggen commit cbf173f82 "Retire ggen-core in favor of a first-principles
# engine"). Not a live path dependency back to ~/ggen -- self-contained,
# depends only on serde/tera/sha2 below.
praxis-core = { path = "../praxis-core" }
oxigraph = "0.5.9"
reqwest = { version = "0.12", features = ["blocking", "json"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
blake3 = "1"
thiserror = "2"
anyhow = "1"
tera = "1.20.0"
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "testbed"
path = "src/bin/testbed.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unexpected_cfgs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
unwrap_used = "warn"
expect_used = "warn"
