[package]
name = "agent8"
version = "26.7.2"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
description = "8-bit agent projection + 64-byte wire ABI (Env64/Pulse64) + branchless fleet kernel."
repository = "https://github.com/seanchatmangpt/praxis"

[dependencies]
serde = { version = "1", features = ["derive"] }
hex = "0.4"
praxis-core = { path = "../praxis-core" }

[dev-dependencies]
serde_json = "1"

[[bench]]
name = "fleet_sweep"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
