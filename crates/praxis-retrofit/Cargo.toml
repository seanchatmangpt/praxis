[package]
name = "praxis-retrofit"
version = "26.6.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
description = "Retrofit automation tool: Apply praxis standards across Rust ecosystem"

[dependencies]
clap-noun-verb = "26.6.13"
clap-noun-verb-macros = "26.6.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22"
regex = "1"
walkdir = "2"
sha2 = "0.10"
blake3 = "1.8.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
insta = "1"

[[bin]]
name = "praxis-retrofit"
path = "src/bin/praxis-retrofit.rs"

[lints]
workspace = true
