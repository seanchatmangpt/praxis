[package]
name = "praxis-retrofit"
version = "26.7.2"
edition = "2021"
rust-version = "1.82"
repository = "https://github.com/seanchatmangpt/praxis"
license = "MIT OR Apache-2.0"
description = "Retrofit automation tool: Apply praxis standards across Rust ecosystem"
readme = "README.md"

[dependencies]
chicago-tdd-tools = { version = "=26.6.30", features = ["ocel-generation"] }
clap-noun-verb = "26.6.2"
clap-noun-verb-macros = "26.6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22"
regex = "1"
walkdir = "2"
glob = "0.3"
sha2 = "0.10"
blake3 = "1.8.5"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
star-toml = "26.7.3"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
insta = "1"
proptest = "1.4"

[[bin]]
name = "praxis-retrofit"
path = "src/bin/praxis-retrofit.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
