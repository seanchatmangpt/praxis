[package]
name = "praxis-synthesis"
version = "26.7.2"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
description = "Prototype synthesis of the deep-research stack: semi-naive Datalog saturation (Nemo), bounded constraint-driven capability sequencing (SMT lesson), content-addressed DAG execution (OxyMake), and refinement-style admission (Flux) — pure Rust, bounded, receipted."

[lib]
doctest = false

[dependencies]
# Dictionary encoding + sorted-ID fact relations, reused as the EDB substrate.
# Restored 2026-08-19: crates/pddl-index was deleted wholesale in commit
# 3da96c67 ("PDDL 3.1 consolidation and refactor progress before restart"),
# but this crate's src/datalog.rs and src/sequence.rs kept their
# `use pddl_index::{Dict, SymId}` imports and this dependency's own doc
# comment, leaving the workspace unbuildable. Restored verbatim from
# 3da96c67^ (the commit immediately before the deletion) with only the
# wasm4pm-compat path fixed from an absolute /Users/sac path to the
# workspace-relative pattern every other crate uses.
pddl-index = { path = "../pddl-index", version = "26.7.2" }

# BLAKE3 content-addressing + rolling receipt chains.
chatman-common = { path = "../chatman-common", version = "26.7.2", features = ["provenance"] }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
praxis-graphlaw = { path = "../praxis-graphlaw", version = "26.7.9" }

[dev-dependencies]
tempfile = "3"
