[package]
name = "cng"
version = "26.9.10"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
description = "Chatman Engine noun-verb CLI: import admitted PDDL Turtle planning artifacts, generate one combined plan, and project/export it as a POWL v2 Turtle workflow artifact (A = mu(O*))."
repository = "https://github.com/seanchatmangpt/praxis"
readme = "README.md"
keywords = ["pddl", "powl", "rdf", "workflow", "planning"]
categories = ["command-line-utilities"]

# Registry-only dependencies: every dependency below is published on
# crates.io, so `cargo publish --dry-run` can package and verify this crate.
[dependencies]
clap-noun-verb = "26.7.4"
clap-noun-verb-macros = "26.7.4"
# The #[verb] macro expands to linkme distributed-slice registrations that
# reference `linkme` from the consuming crate.
linkme = "0.3"
bcinr-pddl = "26.6.26"
# Runner connection (workflow validate/evidence): executes the projected
# workflow on the bcinr-powl branchless scheduler. bcinr-powl 26.6.25 needs a
# nightly toolchain (adt_const_params, generic_const_exprs) — stable
# consumers can build with --no-default-features.
bcinr-powl = { version = "26.6.25", optional = true }
oxigraph = "0.5"
blake3 = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Old-AI cognition breeds (wasm4pm): role inference / lawful-next-action
# derivation inside the benchmark's autonomic chain. Registry version, so
# publishability is preserved; pulled only by the bench feature.
wasm4pm-cognition = { version = "26.7.1", optional = true }
# Deliberate bench-only exception to the registry-only rule (mirrors the
# otel-live exception block below): praxis-graphlaw supplies the Datalog
# role/obligation/custody derivation layer for the benchmark. Pulled ONLY by
# the optional `bench` feature; with `bench` off — the default — this path
# dependency does not participate in the build, so `cargo publish --dry-run`
# of the default surface is unaffected.
praxis-graphlaw = { path = "../praxis-graphlaw", optional = true }
# Same bench-only exception: pddl-index is not published on crates.io (a
# workspace-local sibling of bcinr-pddl, differential-tested against it in
# tests/indexed_grounding.rs — see the wasm4pm-compat patch note in the
# workspace root Cargo.toml). It supplies relaxed-reachability-pruned
# grounding for the decomposition path (crates/cng/src/bench/decomp/),
# where untyped multi-actor domains make bcinr-pddl's full-cross-product
# grounding blow up combinatorially. Pulled ONLY by the optional `bench`
# feature; the default surface is unaffected.
pddl-index = { path = "../pddl-index", optional = true }

# --- otel-live exception block ------------------------------------------
# Deliberate exception to the registry-only rule above: chicago-tdd-tools is
# a LOCAL PATH dependency, pulled ONLY by the optional `otel-live` feature
# (and dev-dependencies below). With `otel-live` off — the default — none of
# these dependencies participate in the build, so `cargo publish --dry-run`
# of the default surface is unaffected. The opentelemetry crates are
# registry-published; the path dep is the sole exception.
chicago-tdd-tools = { path = "/Users/sac/chicago-tdd-tools", features = ["weaver"], optional = true }
opentelemetry = { version = "0.31", optional = true, default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.31", optional = true, default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.31", optional = true, default-features = false, features = ["grpc-tonic", "trace"] }
tokio = { version = "1", optional = true, features = ["rt", "macros", "time"] }
# --- end otel-live exception block --------------------------------------

[features]
default = ["runner"]
runner = ["dep:bcinr-powl"]
# Fortune-5 scale benchmark verbs (cng benchmark generate/run/verify/report).
# Off by default: benchmark instrumentation (wall-clock timing, corpus
# generation) stays out of the published default surface. Requires runner.
bench = ["runner", "dep:wasm4pm-cognition", "dep:praxis-graphlaw", "dep:pddl-index"]
# Production OTel emission surface for the OTel Weaver live-check campaign
# (src/bin/otel-live.rs + src/telemetry_gen.rs). Off by default: the
# publishable surface is unchanged when this feature is off.
otel-live = [
    "dep:chicago-tdd-tools",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tokio",
]

[[bin]]
name = "otel-live"
path = "src/bin/otel-live.rs"
required-features = ["otel-live"]

# Deliberate dev-only exception to the registry-only rule: dev-dependencies
# never affect `cargo publish` packaging or downstream consumers. The
# `weaver` + `otel` features are what `weaver_test!` requires
# (chicago-tdd-tools/src/core/macros/weaver_test.rs gates on both).
[dev-dependencies]
chicago-tdd-tools = { path = "/Users/sac/chicago-tdd-tools", features = ["weaver", "otel"] }
