[package]
name = "wasm4pm-arazzo"
version = "26.7.8"
edition = "2021"
description = "Arazzo Intermediate Representation (AIR) and compiler for wasm4pm"
license = "MIT OR Apache-2.0"

[dependencies]
blake3 = "1.8.5"
bumpalo = { version = "3.20.3", features = ["serde", "collections"] }
phf = { version = "0.14.0", features = ["macros"] }
rayon = "1.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"
wasm-encoder = "0.253.0"
wasm4pm-compat = { path = "../../../wasm4pm-compat", version = "26.6.29" }
