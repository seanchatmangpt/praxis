# typos configuration — https://github.com/crate-ci/typos

[files]
extend-exclude = [
    "Cargo.lock",
    "target/",
    ".git/",
    "pkg/",
    "**/generated/",
    "*.ttl",
    "*.svg",
    "*.lock",
]

[default]
extend-ignore-re = ["\\b[0-9a-f]{32,}\\b"]

[default.extend-words]
ocel = "ocel"
otel = "otel"
calver = "calver"
wasm = "wasm"
