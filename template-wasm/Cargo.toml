[package]
name = "{{project-name}}"
version = "26.6.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
description = "{{description}}"
repository = "https://github.com/seanchatmangpt/{{project-name}}"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
blake3 = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

# WASM-safe release profiles.
# strip = true is deliberately OMITTED: rustc stripping corrupts WASM binaries.
# Use `just build-opt` (wasm-opt -Os) instead.

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[profile.release-mobile]
inherits = "release"
opt-level = "z"  # extreme size minimisation (mobile WASM budget: ~500 KB)

[profile.release-perf]
inherits = "release"
opt-level = 3
lto = "fat"      # maximum inlining; larger binary (~2-3 MB), server/desktop only
