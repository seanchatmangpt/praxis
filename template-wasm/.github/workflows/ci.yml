name: CI (WASM)

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Phase 1: compile and test on native target (fast feedback, no wasm-pack needed)
  test-native:
    name: test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: clippy (native target)
        run: CARGO_BUILD_TARGET="" cargo clippy --all-targets -- -D warnings
      - name: test (native target)
        run: CARGO_BUILD_TARGET="" cargo test --lib

  # Phase 2: build WASM release artefact
  build-wasm:
    name: build (wasm32)
    runs-on: ubuntu-latest
    needs: test-native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM (web target)
        run: wasm-pack build --target web --release
      - name: Upload WASM artefact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: pkg/

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1

  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [test-native, build-wasm, deny, typos]
    if: always()
    steps:
      - name: Require all jobs passed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for r in $results; do
            [ "$r" = "success" ] || exit 1
          done
