[pack]
name = "soc2-audit-pack"
version = "26.7.12"
description = "SOC2 Type II audit ENGAGEMENT PROCESS case study (PUBLIC ontologies only: skos, prov, dcterms, org; blank nodes + skos:notation handles, no private namespace minted for AICPA TSC vocabulary since none exists publicly) and the Solace Cloud case-study fixtures (10 chained audit-phase PDDL Turtle fragments, cycle problem, case-study instance data, SHACL shapes) for the cng PDDL->POWL pipeline. COMPLIANCE-OVERCLAIM FENCE: this pack models the audit ENGAGEMENT PROCESS (evidence gathering, control design/operating-effectiveness evaluation, exception handling) — it never asserts, computes, or implies a compliance verdict or auditor opinion. No action anywhere in the domain has an effect atom named 'compliant' or 'opinion'; the only terminal goal atom is 'evidence-bundle-complete'. No external ontology is unioned — this pack's vocabulary is self-contained SKOS/PROV/DCMI, so no ggen.toml extra_ontologies entry is required."
