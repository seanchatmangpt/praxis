[pack]
name = "f30-ggen-release-state-pack"
version = "0.1.0"
description = "Generates the F30 GGEN Dynamic Project State and Release Admission (V12-030) L5 State Machine data catalog (the 9 mfwrel:LifecycleState individuals -- 8 lawful states plus REFUSED -- and the 9 mfwrel:transitionsTo edges between them, exactly matching v26.7.12_mermaid_atlas/families/F30_ggen-release-state.md's L5 stateDiagram-v2) for crates/multifractal-workflow/src/f30_ggen_release_state_generated.rs, plus the two real SPARQL query bodies (mfwrel:Status CONSTRUCT and mfwrel:dependsOn+ transitive Dependency SELECT, the latter adapted from packs/jira-tracking-pack/templates/jira-deps.rq.tmpl's proven jira:dependsOn+ pattern) synced verbatim to crates/multifractal-workflow/queries/. Pure schema/data projection only -- the ProjectStateGraph/ClaimCeiling/Mermaid-projector/Release-Gate/ReleaseAdmissionRefused pipeline logic that loads and executes these queries at runtime is hand-written in f30_ggen_release_state.rs, not generated; this pack declares no per-ticket instance data (doing so would violate F30's own invariant against hand-typed status prose)."
