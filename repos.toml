# Seanchatmangpt Ecosystem Repository Registry
#
# Metadata for all 18 surveyed repositories in the seanchatmangpt account.
# Used for fleet-wide retrofit planning, prioritization, and risk assessment.
#
# Format:
#   [repos.<github-repo-slug>]
#   - github_url: GitHub HTTPS URL (canonical source)
#   - github_owner: Account owner (always "seanchatmangpt")
#   - local_path: Relative path in the fleet (for local discovery)
#   - crate_name: Primary Rust crate name (from Cargo.toml)
#   - description: What this repo does
#   - visibility: "public" | "private"
#   - workspace_type: "single-crate" | "multi-crate" | "monorepo"
#   - crate_count: Number of publishable crates
#   - retrofit_readiness: "ready" | "requires-prep" | "blocked"
#   - retrofit_phase_complete: 0-5 (phases 1-5, starting from 0=none)
#   - risk_level: "low" | "medium" | "high"
#   - priority_score: 0-100 (higher = should be done first; derived from: adoption, dependents, size)
#   - maintainer_status: "active" | "maintenance" | "experimental"
#   - notes: Any context needed for retrofit decisions

